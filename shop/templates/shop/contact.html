{% extends "shop/base.html" %}

{% block title %}Contact — Student Store{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto">
    <div class="bg-white rounded-2xl shadow-md p-8 md:p-10">
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Contact</p>
        <h1 class="mt-2 text-3xl font-bold text-gray-900">Send us a message</h1>
        <p class="mt-3 text-gray-600">Questions about a product, delivery, or student essentials? Use the form below.</p>

        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name</label>
                <input id="name" name="name" type="text" required
                       class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                <input id="email" name="email" type="email" required
                       class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none">
            </div>
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                <textarea id="message" name="message" rows="5" required
                          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none"></textarea>
            </div>
            <button type="submit" class="inline-flex items-center rounded-lg bg-indigo-600 px-6 py-3 font-medium text-white transition hover:bg-indigo-700">
                Send message
            </button>
        </form>
    </div>
</section>
{% endblock %}
